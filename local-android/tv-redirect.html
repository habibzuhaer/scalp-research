<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sCalp → TradingView</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #0b0e12;
        color: #e8eef6;
      }
      .box {
        text-align: center;
        padding: 24px;
        border: 1px solid #2a3544;
        border-radius: 12px;
        background: #12171e;
        max-width: 480px;
      }
      .muted {
        color: #8b9bb0;
        font-size: 13px;
      }
      code {
        font-family: ui-monospace, monospace;
        font-size: 12px;
        word-break: break-all;
      }
      a {
        color: #f0b429;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div>Переход в TradingView…</div>
      <p class="muted" id="meta">подбор фильтра</p>
      <p><code id="url"></code></p>
      <p class="muted">Если не открылось — <a id="fallback" href="#">откройте вручную</a></p>
    </div>
    <script>
      (function () {
        function pick(arr) {
          return arr[Math.floor(Math.random() * arr.length)]
        }
        function q(name) {
          return new URLSearchParams(location.search).get(name) || ''
        }
        function ticker() {
          var sym = String(q('symbol') || '')
            .toUpperCase()
            .replace(/[^A-Z0-9]/g, '')
          if (!sym) return ''
          var exchange = String(q('exchange') || '').toLowerCase()
          var pane = q('pane')
          var fut = pane === 'futures' || exchange.indexOf('futures') !== -1
          if (exchange.indexOf('bybit') === 0) {
            return fut ? 'BYBIT:' + sym + '.P' : 'BYBIT:' + sym
          }
          return fut ? 'BINANCE:' + sym + '.P' : 'BINANCE:' + sym
        }
        var t = ticker()
        var meta = document.getElementById('meta')
        var urlEl = document.getElementById('url')
        var fallback = document.getElementById('fallback')
        if (!t) {
          meta.textContent = 'нет символа'
          return
        }
        var interval = pick(['1', '3', '5', '15', '30', '60', '240', 'D'])
        var host = pick(['www.tradingview.com', 'ru.tradingview.com'])
        var url =
          'https://' +
          host +
          '/chart/?symbol=' +
          encodeURIComponent(t) +
          '&interval=' +
          encodeURIComponent(interval)
        meta.textContent = t + ' · ' + interval
        urlEl.textContent = url
        fallback.href = url
        location.replace(url)
      })()
    </script>
  </body>
</html>
